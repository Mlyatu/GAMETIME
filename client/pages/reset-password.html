<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />
  <style>
    .reset-page .auth-shell {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    .reset-page #particles-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .reset-page .auth-card {
      width: min(100%, 440px);
      padding: clamp(24px, 5vw, 40px);
    }
  </style>
</head>
<body class="reset-page">

  <div class="auth-shell">
    <div id="particles-bg"></div>

    <div class="glass-card auth-card animate-fade-in-up">
      <a href="/index.html" class="auth-brand text-decoration-none">
        <i class="fa-solid fa-bolt glow-text-primary"></i>
        <span style="color:var(--text-primary);">EFootball <span class="glow-text-secondary">Arena</span></span>
      </a>

      <!-- Missing/invalid token -->
      <div id="noTokenState" class="d-none text-center">
        <i class="fa-solid fa-triangle-exclamation fa-2x mb-3" style="color:var(--color-danger);"></i>
        <h5>Invalid or missing reset link</h5>
        <p class="text-secondary-arena text-sm">This link may have expired. Request a new one below.</p>
        <a href="/pages/forgot-password.html" class="btn-arena btn-arena--primary w-100 mt-2">Request New Link</a>
      </div>

      <!-- Reset form -->
      <div id="formState">
        <div class="text-center mb-4">
          <i class="fa-solid fa-lock fa-2x glow-text-primary mb-3"></i>
          <h5>Choose a new password</h5>
        </div>

        <form id="resetForm" novalidate>
          <div class="mb-3 position-relative">
            <label class="form-label-arena" for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="newPassword" class="form-control-arena" placeholder="At least 8 characters" required minlength="8" />
            <button type="button" class="password-toggle-arena" data-toggle-trigger="newPassword" style="top: 38px; transform:none;" aria-label="Show password">
              <i class="fa-solid fa-eye"></i>
            </button>
            <div class="form-error-arena d-none" data-error-for="newPassword">Minimum 8 characters, must include a number.</div>
          </div>

          <div class="mb-4">
            <label class="form-label-arena" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control-arena" placeholder="Re-enter your new password" required />
            <div class="form-error-arena d-none" data-error-for="confirmPassword"></div>
          </div>

          <div id="formError" class="form-error-arena d-none mb-3" role="alert" aria-live="polite"></div>

          <button type="submit" class="btn-arena btn-arena--primary w-100" id="submitBtn">
            <span id="btnText">Reset Password</span>
            <span class="spinner-arena d-none" id="btnSpinner"></span>
          </button>
        </form>
      </div>

      <!-- Success -->
      <div id="successState" class="d-none text-center">
        <i class="fa-solid fa-circle-check fa-2x mb-3" style="color:var(--color-success);"></i>
        <h5>Password reset</h5>
        <p class="text-secondary-arena text-sm">You can now log in with your new password.</p>
        <a href="/pages/login.html" class="btn-arena btn-arena--primary w-100 mt-2">Go to Login</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
  <script src="/assets/js/particles-config.js"></script>
  <script src="/assets/js/form-utils.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script>
    const resetToken = new URLSearchParams(window.location.search).get('token');
    if (!resetToken) {
      document.getElementById('formState').classList.add('d-none');
      document.getElementById('noTokenState').classList.remove('d-none');
    }

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      clearFormErrors(this);

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      let hasError = false;

      if (newPassword.length < 8 || !/\d/.test(newPassword)) { showFieldError('newPassword', 'Minimum 8 characters, must include a number'); hasError = true; }
      if (newPassword !== confirmPassword) { showFieldError('confirmPassword', 'Passwords do not match'); hasError = true; }
      if (!resetToken) { showFieldError('confirmPassword', 'Missing reset token — request a new link'); hasError = true; }
      if (hasError) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      document.getElementById('btnText').classList.add('d-none');
      document.getElementById('btnSpinner').classList.remove('d-none');

      try {
        await api.post('/auth/reset-password', { token: resetToken, newPassword });
        document.getElementById('formState').classList.add('d-none');
        document.getElementById('successState').classList.remove('d-none');
      } catch (err) {
        ui.handleApiFormError(err, this);
        btn.disabled = false;
        document.getElementById('btnText').classList.remove('d-none');
        document.getElementById('btnSpinner').classList.add('d-none');
      }
    });
  </script>
</body>
</html>
