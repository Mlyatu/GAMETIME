<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />
</head>
<body>

  <div class="auth-shell">
    <div id="particles-bg"></div>

    <div class="glass-card auth-card animate-fade-in-up">
      <a href="/index.html" class="auth-brand text-decoration-none">
        <i class="fa-solid fa-bolt glow-text-primary"></i>
        <span style="color:var(--text-primary);">EFootball <span class="glow-text-secondary">Arena</span></span>
      </a>

      <!-- Request form -->
      <div id="requestState">
        <div class="text-center mb-4">
          <i class="fa-solid fa-key fa-2x glow-text-primary mb-3"></i>
          <h5>Forgot your password?</h5>
          <p class="text-secondary-arena text-sm mb-0">Enter your email and we'll send you a reset link.</p>
        </div>

        <form id="forgotForm" novalidate>
          <div class="mb-4">
            <label class="form-label-arena" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control-arena" placeholder="you@email.com" required />
            <div class="form-error-arena d-none" data-error-for="email"></div>
          </div>

          <button type="submit" class="btn-arena btn-arena--primary w-100" id="submitBtn">
            <span id="btnText">Send Reset Link</span>
            <span class="spinner-arena d-none" id="btnSpinner"></span>
          </button>
        </form>
      </div>

      <!-- Confirmation state -->
      <div id="sentState" class="d-none text-center">
        <i class="fa-solid fa-paper-plane fa-2x glow-text-secondary mb-3"></i>
        <h5>Check your email</h5>
        <p class="text-secondary-arena text-sm">
          If an account exists for that address, we've sent a link to reset your password.
          It expires in 1 hour.
        </p>
      </div>

      <div class="auth-divider">OR</div>
      <p class="text-center text-sm mb-0">
        <a href="/pages/login.html"><i class="fa-solid fa-arrow-left"></i> Back to login</a>
      </p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
  <script src="/assets/js/particles-config.js"></script>
  <script src="/assets/js/form-utils.js"></script>
  <script>
    // TODO (Step 13): wire to POST /api/auth/forgot-password. The
    // backend intentionally returns the same generic success message
    // whether or not the email exists (prevents account enumeration) —
    // this UI already reflects that by design, not as a placeholder.
    document.getElementById('forgotForm').addEventListener('submit', function (e) {
      e.preventDefault();
      clearFormErrors(this);
      const email = document.getElementById('email').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFieldError('email', 'Enter a valid email address');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      document.getElementById('btnText').classList.add('d-none');
      document.getElementById('btnSpinner').classList.remove('d-none');

      setTimeout(() => {
        document.getElementById('requestState').classList.add('d-none');
        document.getElementById('sentState').classList.remove('d-none');
      }, 600);
    });
  </script>
</body>
</html>
