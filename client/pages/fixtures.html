<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fixtures — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />

  <style>
    .fixture-row {
      display: grid;
      grid-template-columns: 110px 1fr auto 1fr 120px;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.02);
      margin-bottom: 10px;
    }
    .fixture-row .player { display: flex; align-items: center; gap: 10px; font-size: var(--text-sm); font-weight: 600; }
    .fixture-row .player.away { justify-content: flex-end; flex-direction: row-reverse; }
    .fixture-score { font-family: var(--font-display); font-weight: 800; font-size: var(--text-lg); text-align: center; min-width: 70px; }
    @media (max-width: 768px) {
      .fixture-row { grid-template-columns: 1fr; text-align:center; gap: 8px; }
      .fixture-row .player.away { flex-direction: row; justify-content: center; }
    }
    .round-heading { margin: 24px 0 12px; font-weight: 700; }
    .round-heading:first-child { margin-top: 0; }
  </style>
</head>
<body>

  <div class="d-flex">
    <div data-include="/components/sidebar.html"></div>

    <div class="flex-grow-1" style="min-width:0;">
      <div data-include="/components/topbar.html"></div>

      <main class="container-arena py-4">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
          <div>
            <h1 class="mb-1">Fixtures</h1>
            <p class="text-secondary-arena mb-0">Browse fixtures and results by tournament.</p>
          </div>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <select class="form-control-arena py-2" id="tournamentSelect" style="width:auto; min-width:220px;">
              <option value="">Select a tournament</option>
            </select>
            <button class="btn-arena btn-arena--primary btn-arena--sm d-none" id="generateFixturesButton"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate fixtures</button>
          </div>
        </div>

        <div id="fixturesContainer" class="glass-card p-4">
          <p class="text-secondary-arena mb-0">Choose a tournament to view its fixtures.</p>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    (function () {
      const tournamentSelect = document.getElementById('tournamentSelect');
      const container = document.getElementById('fixturesContainer');
      let tournaments = [];
      let isStaff = false;

      function titleCase(str) {
        return String(str || '').replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
      }

      function formatDateTime(iso) {
        if (!iso) return 'TBD';
        const d = new Date(iso);
        return isNaN(d) ? iso : d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      }

      function dateTimeInputValue(iso) {
        if (!iso) return '';
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return '';
        return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      }

      async function loadTournaments() {
        try {
          const data = await api.get('/tournament?limit=100');
          tournaments = data.data.tournaments || [];
          tournamentSelect.innerHTML = '<option value="">Select a tournament</option>' + tournaments.map((t) =>
            `<option value="${t.uuid}">${ui.escapeHtml(t.name)}</option>`
          ).join('');

          const currentUser = auth.getUser() || await auth.fetchCurrentUser();
          isStaff = Boolean(currentUser && ['admin', 'moderator'].includes(currentUser.role));
          document.getElementById('generateFixturesButton').classList.toggle('d-none', !isStaff);

          const urlParams = new URLSearchParams(window.location.search);
          const preselected = urlParams.get('tournament');
          if (preselected) {
            tournamentSelect.value = preselected;
            if (tournamentSelect.value) await loadFixtures(preselected);
          }
        } catch (err) {
          ui.showToast(err.message || 'Failed to load tournaments', 'error');
        }
      }

      async function loadFixtures(uuid) {
        ui.renderSkeleton(container, 4, 'skeleton-arena');
        try {
          const data = await api.get(`/tournament/${encodeURIComponent(uuid)}/fixtures`);
          const matches = data.data.matches || [];
          if (matches.length === 0) {
            container.innerHTML = '<p class="text-secondary-arena p-3 mb-0">No fixtures for this tournament yet.</p>';
            return;
          }

          const byRound = matches.reduce((acc, m) => {
            const r = m.round || 'TBD';
            (acc[r] = acc[r] || []).push(m);
            return acc;
          }, {});

          container.innerHTML = Object.entries(byRound).map(([round, roundMatches]) => `
            <h6 class="round-heading">Round ${round}</h6>
            ${roundMatches.map((m) => {
              const homeName = m.home_team_name || m.home_username || 'TBD';
              const awayName = m.away_team_name || m.away_username || 'TBD';
              const isCompleted = m.status === 'completed';
              const isBye = homeName === 'TBD' || awayName === 'TBD';
              const scoreText = isCompleted ? `${m.home_score ?? 0} - ${m.away_score ?? 0}` : 'VS';
              const homeClass = isCompleted && m.home_score > m.away_score ? ' style="color:var(--color-success);"' : '';
              const awayClass = isCompleted && m.away_score > m.home_score ? ' style="color:var(--color-success);"' : '';
              const badge = isBye ? '<span class="badge-arena badge-arena--neutral">Bye</span>' : `<span class="badge-arena badge-arena--primary">${titleCase(m.status)}</span>`;
              const adminControls = isStaff && !isBye ? `
                <div class="d-flex flex-wrap justify-content-end gap-2 mt-2">
                  ${m.status === 'scheduled' ? `<label class="text-xs text-muted">Schedule <input class="form-control-arena py-1" type="datetime-local" data-schedule-input="${ui.escapeHtml(m.uuid)}" value="${dateTimeInputValue(m.scheduled_at)}" /></label><button class="btn-arena btn-arena--secondary btn-arena--sm" data-action="schedule-match" data-id="${ui.escapeHtml(m.uuid)}">Save time</button>` : ''}
                  <input class="form-control-arena py-1" type="number" min="0" aria-label="Home score" placeholder="Home" data-home-score="${ui.escapeHtml(m.uuid)}" value="${isCompleted ? Number(m.home_score) : ''}" style="width:78px;" />
                  <input class="form-control-arena py-1" type="number" min="0" aria-label="Away score" placeholder="Away" data-away-score="${ui.escapeHtml(m.uuid)}" value="${isCompleted ? Number(m.away_score) : ''}" style="width:78px;" />
                  <button class="btn-arena btn-arena--primary btn-arena--sm" data-action="save-score" data-id="${ui.escapeHtml(m.uuid)}">${isCompleted ? 'Update score' : 'Record score'}</button>
                </div>` : '';
              const playerSubmission = !isStaff && !isBye && m.status === 'scheduled' ? `
                <form class="d-flex flex-wrap align-items-end gap-2 mt-2" data-result-form="${ui.escapeHtml(m.uuid)}">
                  <label class="text-xs text-muted">Home score<input class="form-control-arena py-1" type="number" name="claimedHomeScore" min="0" required style="width:90px;" /></label>
                  <label class="text-xs text-muted">Away score<input class="form-control-arena py-1" type="number" name="claimedAwayScore" min="0" required style="width:90px;" /></label>
                  <label class="text-xs text-muted">Final-score screenshot<input class="form-control-arena py-1" type="file" name="screenshot" accept="image/jpeg,image/png,image/webp" required /></label>
                  <button class="btn-arena btn-arena--secondary btn-arena--sm" type="submit"><i class="fa-solid fa-camera"></i> Send score &amp; screenshot</button>
                </form>` : '';
              return `
                <div class="fixture-row">
                  <div class="text-xs text-muted">${formatDateTime(m.scheduled_at)}</div>
                  <div class="player"${homeClass}><img src="/assets/images/avatar-placeholder.svg" class="avatar-arena" width="32" height="32" alt="" /> ${ui.escapeHtml(homeName)}</div>
                  <div class="fixture-score${!isCompleted ? ' text-muted' : ''}">${scoreText}</div>
                  <div class="player away"${awayClass}><img src="/assets/images/avatar-placeholder.svg" class="avatar-arena" width="32" height="32" alt="" /> ${ui.escapeHtml(awayName)}</div>
                  <div class="text-end">${badge}</div>
                </div>
                ${adminControls}
                ${playerSubmission}
              `;
            }).join('')}
          `).join('');
        } catch (err) {
          container.innerHTML = `<p class="text-danger p-3 mb-0">${ui.escapeHtml(err.message || 'Could not load fixtures')}</p>`;
        }
      }

      tournamentSelect.addEventListener('change', async (e) => {
        const uuid = e.target.value;
        if (!uuid) {
          container.innerHTML = '<p class="text-secondary-arena p-3 mb-0">Choose a tournament to view its fixtures.</p>';
          return;
        }
        const url = new URL(window.location.href);
        url.searchParams.set('tournament', uuid);
        window.history.replaceState({}, '', url.toString());
        await loadFixtures(uuid);
      });

      container.addEventListener('submit', async (event) => {
        const form = event.target.closest('[data-result-form]');
        if (!form) return;
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        const formData = new FormData(form);
        formData.set('matchUuid', form.dataset.resultForm);
        button.disabled = true;
        try {
          await api.upload('/result', formData);
          ui.showToast('Screenshot submitted for admin review', 'success');
          form.innerHTML = '<span class="text-secondary-arena text-sm">Result submitted and waiting for review.</span>';
        } catch (error) {
          ui.showToast(error.message || 'Could not submit result', 'error');
          button.disabled = false;
        }
      });

      document.getElementById('generateFixturesButton').addEventListener('click', async () => {
        const uuid = tournamentSelect.value;
        if (!uuid) return;
        const button = document.getElementById('generateFixturesButton');
        button.disabled = true;
        try {
          await api.post(`/tournament/${encodeURIComponent(uuid)}/fixtures/generate`, {});
          ui.showToast('Fixtures generated', 'success');
          await loadFixtures(uuid);
        } catch (error) {
          ui.showToast(error.message || 'Could not generate fixtures', 'error');
        } finally {
          button.disabled = false;
        }
      });

      container.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-action]');
        if (!button || !isStaff) return;
        const matchUuid = button.dataset.id;
        button.disabled = true;
        try {
          if (button.dataset.action === 'schedule-match') {
            const input = container.querySelector(`[data-schedule-input="${CSS.escape(matchUuid)}"]`);
            if (!input || !input.value) throw new Error('Choose a date and time first.');
            await api.patch(`/match/${encodeURIComponent(matchUuid)}/schedule`, { scheduledAt: new Date(input.value).toISOString() });
            ui.showToast('Fixture scheduled', 'success');
          } else if (button.dataset.action === 'save-score') {
            const homeScore = container.querySelector(`[data-home-score="${CSS.escape(matchUuid)}"]`).value;
            const awayScore = container.querySelector(`[data-away-score="${CSS.escape(matchUuid)}"]`).value;
            if (homeScore === '' || awayScore === '') throw new Error('Enter both scores.');
            await api.patch(`/match/${encodeURIComponent(matchUuid)}/score`, { homeScore: Number(homeScore), awayScore: Number(awayScore) });
            ui.showToast('Score saved and standings updated', 'success');
          }
          await loadFixtures(tournamentSelect.value);
        } catch (error) {
          ui.showToast(error.message || 'Could not update fixture', 'error');
        } finally {
          button.disabled = false;
        }
      });

      document.addEventListener('arena:includes-loaded', () => {
        if (window.auth && !auth.requireAuth()) return;
        document.querySelectorAll('[data-nav]').forEach((link) => {
          if (link.dataset.nav === 'fixtures') link.classList.add('active');
        });
        loadTournaments();
      });
    })();
  </script>
</body>
</html>
