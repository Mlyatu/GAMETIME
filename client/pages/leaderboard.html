<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />

  <style>
    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 16px; margin-bottom: 40px; }
    .podium-card { text-align: center; padding: 24px 20px; width: 180px; }
    .podium-card--first { padding-top: 40px; order: 2; }
    .podium-card--second { order: 1; }
    .podium-card--third { order: 3; }
    .podium-rank {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 800;
      margin: 0 auto 10px;
    }
    .rank-cell { font-family: var(--font-display); font-weight: 800; width: 40px; }
    .rank-cell.top3 { color: var(--color-warning); }
  </style>
</head>
<body>

  <div class="d-flex">
    <div data-include="/components/sidebar.html"></div>

    <div class="flex-grow-1" style="min-width:0;">
      <div data-include="/components/topbar.html"></div>

      <main class="container-arena py-4">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
          <div>
            <h1 class="mb-1">Tournament Leaderboard</h1>
            <p class="text-secondary-arena mb-0">Rankings from confirmed match results.</p>
          </div>
          <select class="form-control-arena py-2" id="leaderboardTournament" style="width:auto;" aria-label="Choose a tournament">
            <option value="">Loading tournaments...</option>
          </select>
        </div>

        <!-- PODIUM -->
        <div class="podium" id="leaderboardPodium"></div>

        <!-- FULL TABLE -->
        <div class="glass-card p-2">
          <div class="table-responsive-arena">
          <table class="table-arena">
            <thead>
              <tr><th>Rank</th><th>Player / Team</th><th>Played</th><th>W</th><th>D</th><th>L</th><th>Win Rate</th><th>Points</th></tr>
            </thead>
            <tbody id="leaderboardRows"><tr><td colspan="8" class="text-secondary-arena">Choose a tournament to view standings.</td></tr></tbody>
          </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script>
    const tournamentSelect = document.getElementById('leaderboardTournament');
    const leaderboardRows = document.getElementById('leaderboardRows');
    const leaderboardPodium = document.getElementById('leaderboardPodium');

    async function loadStandings(tournamentUuid) {
      if (!tournamentUuid) {
        leaderboardRows.innerHTML = '<tr><td colspan="8" class="text-secondary-arena">No tournament selected.</td></tr>';
        leaderboardPodium.innerHTML = '';
        return;
      }
      leaderboardRows.innerHTML = '<tr><td colspan="8" class="text-secondary-arena">Loading standings...</td></tr>';
      try {
        const response = await api.get(`/tournament/${encodeURIComponent(tournamentUuid)}/standings`);
        const standings = response.data.standings || [];
        if (!standings.length) {
          leaderboardRows.innerHTML = '<tr><td colspan="8" class="text-secondary-arena">Standings will appear after match results are recorded.</td></tr>';
          leaderboardPodium.innerHTML = '';
          return;
        }

        leaderboardRows.innerHTML = standings.map((row) => {
          const played = Number(row.played || 0);
          const winRate = played ? `${Math.round((Number(row.won || 0) / played) * 100)}%` : '0%';
          const name = row.player_username || row.team_name || 'Unknown entrant';
          return `<tr>
            <td class="rank-cell${Number(row.rank) <= 3 ? ' top3' : ''}">${Number(row.rank)}</td>
            <td>${ui.escapeHtml(name)}</td>
            <td>${played}</td><td>${Number(row.won || 0)}</td><td>${Number(row.drawn || 0)}</td><td>${Number(row.lost || 0)}</td>
            <td>${winRate}</td><td><strong>${Number(row.points || 0)}</strong></td>
          </tr>`;
        }).join('');

        const podium = standings.slice(0, 3);
        leaderboardPodium.innerHTML = podium.map((row, index) => {
          const rank = Number(row.rank);
          const place = rank === 1 ? 'first' : rank === 2 ? 'second' : 'third';
          const rankContent = rank === 1 ? '<i class="fa-solid fa-crown"></i>' : rank;
          return `<div class="glass-card podium-card podium-card--${place}${rank === 1 ? ' glow-primary' : ''}">
            <div class="podium-rank">${rankContent}</div>
            <img src="/assets/images/avatar-placeholder.svg" class="avatar-arena mb-2" width="${rank === 1 ? 72 : 56}" height="${rank === 1 ? 72 : 56}" alt="" />
            <h6 class="mb-0">${ui.escapeHtml(row.player_username || row.team_name || 'Unknown entrant')}</h6>
            <p class="text-xs text-muted mb-0">${Number(row.points || 0)} pts</p>
          </div>`;
        }).join('');
      } catch (error) {
        leaderboardRows.innerHTML = `<tr><td colspan="8" class="text-secondary-arena">${ui.escapeHtml(error.message || 'Standings could not be loaded.')}</td></tr>`;
        leaderboardPodium.innerHTML = '';
      }
    }

    tournamentSelect.addEventListener('change', () => loadStandings(tournamentSelect.value));

    document.addEventListener('arena:includes-loaded', () => {
      document.querySelectorAll('[data-nav]').forEach((link) => {
        if (link.dataset.nav === 'leaderboard') link.classList.add('active');
      });
      api.get('/tournament?limit=100').then((response) => {
        const tournaments = response.data.tournaments || [];
        if (!tournaments.length) {
          tournamentSelect.innerHTML = '<option value="">No tournaments available</option>';
          leaderboardRows.innerHTML = '<tr><td colspan="8" class="text-secondary-arena">No tournament standings are available yet.</td></tr>';
          return;
        }
        tournamentSelect.innerHTML = tournaments.map((tournament) => `<option value="${ui.escapeHtml(tournament.uuid)}">${ui.escapeHtml(tournament.name)} · ${ui.escapeHtml(tournament.status)}</option>`).join('');
        loadStandings(tournamentSelect.value);
      }).catch((error) => {
        tournamentSelect.innerHTML = '<option value="">Unable to load tournaments</option>';
        leaderboardRows.innerHTML = `<tr><td colspan="8" class="text-secondary-arena">${ui.escapeHtml(error.message || 'Tournament list could not be loaded.')}</td></tr>`;
      });
    });
  </script>
</body>
</html>
