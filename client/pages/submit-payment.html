<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Payment — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />

  <style>
    .preview-img { max-height: 220px; object-fit: contain; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body>

  <div class="d-flex">
    <div data-include="/components/sidebar.html"></div>

    <div class="flex-grow-1" style="min-width:0;">
      <div data-include="/components/topbar.html"></div>

      <main class="container-arena py-5">
        <div class="row justify-content-center">
          <div class="col-lg-6 col-md-8">
            <div class="glass-card p-4 p-md-5">
              <h2 class="mb-1">Submit Payment</h2>
              <p class="text-secondary-arena mb-4">Upload proof-of-payment for your tournament entry fee.</p>

              <form id="paymentForm">
                <div id="formError" class="alert-arena alert-arena--danger d-none mb-3"></div>

                <div class="mb-3">
                  <label class="form-label-arena">Tournament</label>
                  <select id="tournamentUuid" name="tournamentUuid" class="form-control-arena" required>
                    <option value="">Select a tournament</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label-arena">Payment Method</label>
                  <select id="method" name="method" class="form-control-arena" required>
                    <option value="">Select method</option>
                    <option value="mpesa">M-Pesa</option>
                    <option value="airtel_money">Airtel Money</option>
                    <option value="tigo_pesa">Tigo Pesa</option>
                    <option value="halopesa">Halopesa</option>
                    <option value="bank">Bank Transfer</option>
                  </select>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-7">
                    <label class="form-label-arena">Amount</label>
                    <input type="number" id="amount" name="amount" class="form-control-arena" step="0.01" min="0.01" required />
                  </div>
                  <div class="col-5">
                    <label class="form-label-arena">Currency</label>
                    <input type="text" id="currency" name="currency" class="form-control-arena" value="TZS" maxlength="10" required />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label-arena">Transaction Reference (optional)</label>
                  <input type="text" id="transactionReference" name="transactionReference" class="form-control-arena" maxlength="100" />
                </div>

                <div class="mb-4">
                  <label class="form-label-arena">Proof Screenshot</label>
                  <input type="file" id="proof" name="proof" class="form-control-arena" accept="image/png,image/jpeg,image/jpg,image/webp" required />
                  <div id="proofPreview" class="mt-3"></div>
                  <div class="form-text-arena text-muted">Max 5 MB. PNG, JPG or WebP.</div>
                </div>

                <button type="submit" class="btn-arena btn-arena--primary w-100" id="submitBtn">
                  <span><i class="fa-solid fa-paper-plane me-2"></i>Submit Payment</span>
                </button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    (function () {
      const tournamentSelect = document.getElementById('tournamentUuid');
      const methodSelect = document.getElementById('method');
      const amountInput = document.getElementById('amount');
      const proofInput = document.getElementById('proof');
      const previewContainer = document.getElementById('proofPreview');
      const form = document.getElementById('paymentForm');
      const formError = document.getElementById('formError');
      const submitBtn = document.getElementById('submitBtn');

      function showError(msg) {
        formError.textContent = msg;
        formError.classList.remove('d-none');
      }

      function clearError() {
        formError.classList.add('d-none');
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        const span = submitBtn.querySelector('span');
        if (span) span.innerHTML = loading ? '<span class="spinner-arena me-2"></span>Submitting...' : '<i class="fa-solid fa-paper-plane me-2"></i>Submit Payment';
      }

      async function loadTournaments() {
        try {
          const data = await api.get('/tournament?status=registration_open&limit=100');
          const tournaments = data.data.tournaments || [];
          tournaments.forEach((t) => {
            const opt = document.createElement('option');
            opt.value = t.uuid;
            opt.textContent = `${t.name} — ${t.entry_fee ? t.entry_fee.toLocaleString() + ' ' + (t.currency || 'TZS') : 'Free'}`;
            tournamentSelect.appendChild(opt);
          });
          const params = new URLSearchParams(window.location.search);
          const prefill = params.get('tournament');
          if (prefill) tournamentSelect.value = prefill;
        } catch (err) {
          showError(err.message || 'Could not load tournaments');
        }
      }

      tournamentSelect.addEventListener('change', async () => {
        if (!tournamentSelect.value) return;
        try {
          const data = await api.get(`/tournament/${encodeURIComponent(tournamentSelect.value)}`);
          const t = data.data.tournament;
          if (t && t.entry_fee > 0) {
            amountInput.value = t.entry_fee;
            document.getElementById('currency').value = t.currency || 'TZS';
          }
        } catch {
          // ignore
        }
      });

      proofInput.addEventListener('change', () => {
        previewContainer.innerHTML = '';
        const file = proofInput.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showError('Please select an image file');
          proofInput.value = '';
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          showError('Image must be smaller than 5 MB');
          proofInput.value = '';
          return;
        }
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        img.className = 'preview-img';
        previewContainer.appendChild(img);
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();
        const file = proofInput.files[0];
        if (!file) return showError('A proof screenshot is required');
        if (!file.type.startsWith('image/')) return showError('Proof must be an image');
        if (file.size > 5 * 1024 * 1024) return showError('Image must be smaller than 5 MB');

        const formData = new FormData(form);
        setLoading(true);
        try {
          await api.upload('/payment', formData);
          ui.showToast('Payment submitted — awaiting verification', 'success');
          form.reset();
          previewContainer.innerHTML = '';
          setTimeout(() => window.location.href = '/pages/dashboard.html', 1000);
        } catch (err) {
          showError(err.message || 'Failed to submit payment');
        } finally {
          setLoading(false);
        }
      });

      document.addEventListener('arena:includes-loaded', () => {
        if (window.auth) { auth.requireAuth(); auth.updateAuthUI(); }
        loadTournaments();
      });
    })();
  </script>
</body>
</html>
