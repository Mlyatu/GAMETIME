<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />
</head>
<body>

  <div class="auth-shell">
    <div class="glass-card auth-card animate-fade-in-up text-center">
      <a href="/index.html" class="auth-brand text-decoration-none">
        <i class="fa-solid fa-bolt glow-text-primary"></i>
        <span style="color:var(--text-primary);">EFootball <span class="glow-text-secondary">Arena</span></span>
      </a>

      <!-- Loading -->
      <div id="loadingState" class="py-4">
        <span class="spinner-arena" style="width:32px; height:32px; border-width:3px;"></span>
        <p class="text-secondary-arena text-sm mt-3 mb-0">Verifying your email...</p>
      </div>

      <!-- Success -->
      <div id="successState" class="d-none">
        <i class="fa-solid fa-circle-check fa-3x mb-3" style="color:var(--color-success);"></i>
        <h5>Email verified!</h5>
        <p class="text-secondary-arena text-sm">Your account is fully active. You can log in now.</p>
        <a href="/pages/login.html" class="btn-arena btn-arena--primary w-100 mt-2">Go to Login</a>
      </div>

      <!-- Failure -->
      <div id="errorState" class="d-none">
        <i class="fa-solid fa-circle-xmark fa-3x mb-3" style="color:var(--color-danger);"></i>
        <h5>Verification failed</h5>
        <p class="text-secondary-arena text-sm">This link may be invalid or expired.</p>
        <a href="/pages/login.html" class="btn-arena btn-arena--secondary w-100 mt-2">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = new URLSearchParams(window.location.search).get('token');
      const loading = document.getElementById('loadingState');
      const success = document.getElementById('successState');
      const error = document.getElementById('errorState');

      if (!token) {
        loading.classList.add('d-none');
        error.classList.remove('d-none');
        return;
      }

      try {
        await api.get(`/auth/verify-email?token=${encodeURIComponent(token)}`);
        loading.classList.add('d-none');
        success.classList.remove('d-none');
      } catch (err) {
        loading.classList.add('d-none');
        error.classList.remove('d-none');
        ui.showToast(err.message || 'Verification failed', 'error');
      }
    });
  </script>
</body>
</html>
