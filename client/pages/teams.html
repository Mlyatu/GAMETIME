<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />

  <style>
    .team-crest {
      width: 56px; height: 56px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 800; font-size: var(--text-lg);
      color: #06111f;
    }
    .team-avatars { display: flex; }
    .team-avatars img { border-radius: 50%; border: 2px solid var(--bg-elevated); margin-left: -10px; }
    .team-avatars img:first-child { margin-left: 0; }
  </style>
</head>
<body>

  <div class="d-flex">
    <div data-include="/components/sidebar.html"></div>

    <div class="flex-grow-1" style="min-width:0;">
      <div data-include="/components/topbar.html"></div>

      <main class="container-arena py-4">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
          <div>
            <h1 class="mb-1">Teams</h1>
            <p class="text-secondary-arena mb-0">Browse teams or create your own for team-format tournaments.</p>
          </div>
          <button class="btn-arena btn-arena--primary" data-bs-toggle="modal" data-bs-target="#createTeamModal" id="openCreateTeamBtn">
            <i class="fa-solid fa-plus"></i> Create Team
          </button>
        </div>

        <div class="row g-4" id="teamsGrid"></div>

        <nav class="d-flex justify-content-center mt-5" id="teamsPagination"></nav>

      </main>
    </div>
  </div>

  <!-- CREATE TEAM MODAL -->
  <div class="modal fade" id="createTeamModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card border-0 p-2">
        <div class="modal-header border-0">
          <h5 class="modal-title">Create a Team</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="createTeamForm" novalidate>
            <div class="mb-3">
              <label class="form-label-arena" for="teamName">Team Name</label>
              <input type="text" id="teamName" class="form-control-arena" placeholder="e.g. Arena Wolves" required maxlength="100" />
              <div class="form-error-arena d-none" data-error-for="teamName"></div>
            </div>
            <div class="mb-3">
              <label class="form-label-arena" for="teamTag">Team Tag <span class="text-muted">(optional, max 10 chars)</span></label>
              <input type="text" id="teamTag" class="form-control-arena" placeholder="e.g. AWX" maxlength="10" />
            </div>
            <p class="text-xs text-muted">You'll automatically become the team's captain.</p>
            <button type="submit" class="btn-arena btn-arena--primary w-100 mt-2" id="createTeamSubmit">Create Team</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/form-utils.js"></script>
  <script>
    (function () {
      const LIMIT = 12;
      let state = { page: 1 };

      function initials(name) {
        return String(name || '')
          .split(/\s+/)
          .map((w) => w[0])
          .join('')
          .toUpperCase()
          .slice(0, 2);
      }

      function renderTeams(teams) {
        const grid = document.getElementById('teamsGrid');
        if (!teams || teams.length === 0) {
          return ui.renderEmpty(grid, 'No teams found.', '<button class="btn-arena btn-arena--primary btn-arena--sm" data-bs-toggle="modal" data-bs-target="#createTeamModal">Create the first team</button>');
        }
        grid.innerHTML = teams.map((t) => {
          const memberCount = Number(t.member_count || 0);
          return `
            <div class="col-md-6 col-lg-4">
              <div class="glass-card glass-card--interactive p-4">
                <div class="d-flex align-items-center gap-3 mb-3">
                  <div class="team-crest">${initials(t.name || 'T')}</div>
                  <div>
                    <h6 class="mb-0">${ui.escapeHtml(t.name)}</h6>
                    <span class="text-xs text-muted">Captain: ${ui.escapeHtml(t.captain_username || 'Unknown')}</span>
                    ${t.tag ? `<div class="text-xs text-muted">Tag: ${ui.escapeHtml(t.tag)}</div>` : ''}
                  </div>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <div class="team-avatars">
                    <img src="/assets/images/avatar-placeholder.svg" width="28" height="28" alt="" />
                    <img src="/assets/images/avatar-placeholder.svg" width="28" height="28" alt="" />
                  </div>
                  <span class="text-xs text-muted">${memberCount} member${memberCount === 1 ? '' : 's'}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderPagination(page, hasMore) {
        const nav = document.getElementById('teamsPagination');
        const prevDisabled = page <= 1 ? 'disabled' : '';
        const nextDisabled = !hasMore ? 'disabled' : '';
        nav.innerHTML = `
          <ul class="pagination" style="gap:8px;">
            <li><button class="btn-arena btn-arena--secondary btn-arena--sm" data-page="${page - 1}" ${prevDisabled}><i class="fa-solid fa-chevron-left"></i></button></li>
            <li><span class="btn-arena btn-arena--ghost btn-arena--sm" style="cursor:default;">Page ${page}</span></li>
            <li><button class="btn-arena btn-arena--secondary btn-arena--sm" data-page="${page + 1}" ${nextDisabled}><i class="fa-solid fa-chevron-right"></i></button></li>
          </ul>
        `;
        nav.querySelectorAll('button[data-page]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (btn.disabled) return;
            state.page = Number(btn.dataset.page);
            loadTeams();
          });
        });
      }

      async function loadTeams() {
        const grid = document.getElementById('teamsGrid');
        ui.renderSkeleton(grid, 6, 'skeleton-arena');
        try {
          const params = new URLSearchParams({ page: state.page, limit: LIMIT });
          const data = await api.get(`/team?${params.toString()}`);
          const teams = data.data.teams || [];
          renderTeams(teams);
          renderPagination(state.page, teams.length === LIMIT);
        } catch (err) {
          ui.renderEmpty(grid, err.message || 'Failed to load teams.', '<button class="btn-arena btn-arena--secondary btn-arena--sm" onclick="location.reload()">Retry</button>');
          ui.showToast(err.message || 'Failed to load teams', 'error');
        }
      }

      async function handleCreateTeam(e) {
        e.preventDefault();
        clearFormErrors(document.getElementById('createTeamForm'));

        const name = document.getElementById('teamName').value.trim();
        const tag = document.getElementById('teamTag').value.trim();
        if (!name) {
          showFieldError('teamName', 'Team name is required');
          return;
        }

        const btn = document.getElementById('createTeamSubmit');
        ui.setButtonLoading(btn, true);
        try {
          await api.post('/team', { name, tag: tag || undefined });
          ui.showToast('Team created successfully', 'success');
          document.getElementById('createTeamForm').reset();
          const modalEl = document.getElementById('createTeamModal');
          const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
          modal.hide();
          state.page = 1;
          await loadTeams();
        } catch (err) {
          ui.handleApiFormError(err, document.getElementById('createTeamForm'));
        } finally {
          ui.setButtonLoading(btn, false);
        }
      }

      document.addEventListener('arena:includes-loaded', () => {
        if (window.auth) auth.requireAuth();
        document.querySelectorAll('[data-nav]').forEach((link) => {
          if (link.dataset.nav === 'teams') link.classList.add('active');
        });
        document.getElementById('createTeamForm').addEventListener('submit', handleCreateTeam);
        loadTeams();
      });
    })();
  </script>
</body>
</html>
