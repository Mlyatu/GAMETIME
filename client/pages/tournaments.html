<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournaments — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />

  <style>
    .filter-pill {
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      font-size: var(--text-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .filter-pill.active, .filter-pill:hover {
      background: rgba(var(--color-primary-rgb), .15);
      border-color: rgba(var(--color-primary-rgb), .4);
      color: var(--text-primary);
    }
    .tournament-banner {
      height: 150px;
      position: relative;
    }
    .tournament-banner .badge-arena { position: absolute; top: 14px; left: 14px; }
    .tournament-meta { margin: 10px 0 16px; }
    .tournament-meta span { font-size: var(--text-xs); color: var(--text-muted); margin-right: 16px; display: inline-block; }
    .tournament-meta span i { margin-right: 6px; }
  </style>
</head>
<body>

  <div class="d-flex">
    <div data-include="/components/sidebar.html"></div>

    <div class="flex-grow-1" style="min-width:0;">
      <div data-include="/components/topbar.html"></div>

      <main class="container-arena py-4">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
          <div>
            <h1 class="mb-1">Tournaments</h1>
            <p class="text-secondary-arena mb-0">Browse open, ongoing, and completed competitions.</p>
          </div>
        </div>

        <!-- FILTERS -->
        <div class="glass-card p-3 mb-4 d-flex flex-wrap gap-2 align-items-center">
          <button class="filter-pill active" data-filter="status" data-value="all">All</button>
          <button class="filter-pill" data-filter="status" data-value="registration_open">Registration Open</button>
          <button class="filter-pill" data-filter="status" data-value="ongoing">Ongoing</button>
          <button class="filter-pill" data-filter="status" data-value="completed">Completed</button>
          <div class="ms-auto">
            <select class="form-control-arena py-2" id="formatFilter" style="width:auto;">
              <option value="">All Formats</option>
              <option value="league">League</option>
              <option value="knockout">Knockout</option>
              <option value="round_robin">Round Robin</option>
              <option value="swiss">Swiss</option>
              <option value="groups">Groups</option>
            </select>
          </div>
        </div>

        <!-- GRID -->
        <div class="row g-4" id="tournamentGrid"></div>

        <!-- PAGINATION -->
        <nav class="d-flex justify-content-center mt-5" id="tournamentPagination"></nav>

      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    (function () {
      const LIMIT = 12;
      let state = { status: 'all', format: '', page: 1 };

      function titleCase(str) {
        return str.replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
      }

      function formatMoney(n) {
        const num = Number(n || 0);
        if (num === 0) return 'Free';
        return `TZS ${num.toLocaleString('en-US')}`;
      }

      function formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return isNaN(d) ? iso : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      function statusBadge(status) {
        const map = {
          registration_open: { label: 'Registration Open', class: 'badge-arena--primary' },
          ongoing: { label: 'Ongoing', class: 'badge-arena--success' },
          completed: { label: 'Completed', class: 'badge-arena--neutral' },
          cancelled: { label: 'Cancelled', class: 'badge-arena--danger' },
          draft: { label: 'Draft', class: 'badge-arena--warning' },
        };
        const cfg = map[status] || { label: titleCase(status || 'Unknown'), class: 'badge-arena--neutral' };
        return `<span class="badge-arena ${cfg.class}">${cfg.label}</span>`;
      }

      function bannerGradient(status) {
        switch (status) {
          case 'registration_open':
            return 'linear-gradient(135deg, rgba(var(--color-primary-rgb),.35), rgba(var(--color-secondary-rgb),.15))';
          case 'ongoing':
            return 'linear-gradient(135deg, rgba(var(--color-success-rgb),.3), rgba(var(--color-primary-rgb),.15))';
          case 'completed':
            return 'linear-gradient(135deg, rgba(120,120,120,.25), rgba(80,80,80,.15))';
          case 'cancelled':
            return 'linear-gradient(135deg, rgba(var(--color-danger-rgb),.25), rgba(var(--color-warning-rgb),.15))';
          default:
            return 'linear-gradient(135deg, rgba(var(--color-warning-rgb),.25), rgba(var(--color-primary-rgb),.15))';
        }
      }

      function renderTournaments(tournaments) {
        const grid = document.getElementById('tournamentGrid');
        if (!tournaments || tournaments.length === 0) {
          return ui.renderEmpty(grid, 'No tournaments found.', '<a href="/pages/dashboard.html" class="btn-arena btn-arena--primary btn-arena--sm">Back to Dashboard</a>');
        }
        grid.innerHTML = tournaments.map((t) => {
          const entrants = `${Number(t.approved_count || 0)} / ${t.max_participants || '∞'}`;
          return `
            <div class="col-md-6 col-lg-4">
              <a href="/pages/tournament-detail.html?id=${encodeURIComponent(t.uuid)}" class="text-decoration-none">
                <div class="glass-card glass-card--interactive overflow-hidden h-100">
                  <div class="tournament-banner" style="background:${bannerGradient(t.status)};">
                    ${statusBadge(t.status)}
                  </div>
                  <div class="p-4">
                    <h5 style="color:var(--text-primary);">${ui.escapeHtml(t.name)}</h5>
                    <div class="tournament-meta">
                      <span><i class="fa-solid fa-sitemap"></i> ${titleCase(t.format)}</span>
                      <span><i class="fa-solid fa-users"></i> ${entrants}</span>
                      <span><i class="fa-solid fa-coins"></i> ${formatMoney(t.entry_fee)}</span>
                    </div>
                    <div class="btn-arena btn-arena--secondary btn-arena--sm w-100 mt-2">View Details</div>
                  </div>
                </div>
              </a>
            </div>
          `;
        }).join('');
      }

      function renderPagination(page, hasMore) {
        const nav = document.getElementById('tournamentPagination');
        const prevDisabled = page <= 1 ? 'disabled' : '';
        const nextDisabled = !hasMore ? 'disabled' : '';
        nav.innerHTML = `
          <ul class="pagination" style="gap:8px;">
            <li><button class="btn-arena btn-arena--secondary btn-arena--sm" data-page="${page - 1}" ${prevDisabled}><i class="fa-solid fa-chevron-left"></i></button></li>
            <li><span class="btn-arena btn-arena--ghost btn-arena--sm" style="cursor:default;">Page ${page}</span></li>
            <li><button class="btn-arena btn-arena--secondary btn-arena--sm" data-page="${page + 1}" ${nextDisabled}><i class="fa-solid fa-chevron-right"></i></button></li>
          </ul>
        `;
        nav.querySelectorAll('button[data-page]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (btn.disabled) return;
            state.page = Number(btn.dataset.page);
            loadTournaments();
          });
        });
      }

      async function loadTournaments() {
        const grid = document.getElementById('tournamentGrid');
        ui.renderSkeleton(grid, 6, 'skeleton-arena');
        try {
          const params = new URLSearchParams({ page: state.page, limit: LIMIT });
          if (state.status && state.status !== 'all') params.set('status', state.status);
          if (state.format) params.set('format', state.format);
          const data = await api.get(`/tournament?${params.toString()}`);
          const tournaments = data.data.tournaments || [];
          renderTournaments(tournaments);
          renderPagination(state.page, tournaments.length === LIMIT);
        } catch (err) {
          ui.renderEmpty(grid, err.message || 'Failed to load tournaments.', '<button class="btn-arena btn-arena--secondary btn-arena--sm" onclick="location.reload()">Retry</button>');
          ui.showToast(err.message || 'Failed to load tournaments', 'error');
        }
      }

      function bindFilters() {
        document.querySelectorAll('.filter-pill').forEach((pill) => {
          pill.addEventListener('click', () => {
            document.querySelectorAll('.filter-pill').forEach((p) => p.classList.remove('active'));
            pill.classList.add('active');
            state.status = pill.dataset.value;
            state.page = 1;
            loadTournaments();
          });
        });

        document.getElementById('formatFilter').addEventListener('change', (e) => {
          state.format = e.target.value;
          state.page = 1;
          loadTournaments();
        });
      }

      document.addEventListener('arena:includes-loaded', () => {
        if (window.auth) { auth.requireAuth(); auth.updateAuthUI(); }
        document.querySelectorAll('[data-nav]').forEach((link) => {
          if (link.dataset.nav === 'tournaments') link.classList.add('active');
        });
        bindFilters();
        loadTournaments();
      });
    })();
  </script>
</body>
</html>
