<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />

  <style>
    .chat-shell { display: flex; flex-direction: column; height: calc(100vh - var(--topbar-height) - 48px); min-height: 420px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 8px 4px; display: flex; flex-direction: column; gap: 12px; }
    .chat-msg { display: flex; gap: 10px; max-width: 82%; }
    .chat-msg .bubble { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 10px 14px; }
    .chat-msg .bubble .meta { font-size: var(--text-xs); color: var(--text-muted); margin-bottom: 2px; }
    .chat-msg .bubble .text { color: var(--text-primary); font-size: var(--text-sm); word-break: break-word; }
    .chat-msg.is-mine { align-self: flex-end; flex-direction: row-reverse; }
    .chat-msg.is-mine .bubble { background: rgba(var(--color-primary-rgb), .14); border-color: rgba(var(--color-primary-rgb), .35); }
    .chat-composer { display: flex; gap: 10px; padding-top: 14px; border-top: 1px solid var(--glass-border); }
    .chat-composer .form-control-arena { flex: 1; }
    .chat-status { font-size: var(--text-xs); color: var(--text-muted); }
    .chat-status.is-live { color: var(--color-success); }
  </style>
</head>
<body>

  <div class="d-flex">
    <div data-include="/components/sidebar.html"></div>
    <div class="flex-grow-1" style="min-width:0;">
      <div data-include="/components/topbar.html"></div>
      <main class="container-arena py-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
          <div>
            <h1 class="mb-1">Community Chat</h1>
            <p class="text-secondary-arena mb-0">Talk with players across the arena.</p>
          </div>
          <span class="chat-status" id="chatStatus"><span class="badge-dot badge-dot--offline"></span> Connecting…</span>
        </div>

        <div class="glass-card p-3 p-sm-4">
          <div class="chat-shell">
            <div class="chat-messages" id="chatMessages"></div>
            <form class="chat-composer" id="chatForm">
              <input type="text" id="chatInput" class="form-control-arena" placeholder="Type a message..." maxlength="2000" autocomplete="off" />
              <button type="submit" class="btn-arena btn-arena--primary" id="chatSendBtn" aria-label="Send message">
                <i class="fa-solid fa-paper-plane"></i>
              </button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    (function () {
      var messagesEl = document.getElementById('chatMessages');
      var form = document.getElementById('chatForm');
      var input = document.getElementById('chatInput');
      var statusEl = document.getElementById('chatStatus');
      var CHANNEL = 'global';
      var socket = null;
      var myUuid = null;

      function setStatus(live, text) {
        statusEl.className = 'chat-status' + (live ? ' is-live' : '');
        statusEl.innerHTML = '<span class="badge-dot badge-dot--' + (live ? 'online' : 'offline') + '"></span> ' + text;
      }

      function timeOf(value) {
        var d = new Date(value);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }

      function appendMessage(msg, mine) {
        var wrap = document.createElement('div');
        wrap.className = 'chat-msg' + (mine ? ' is-mine' : '');
        wrap.innerHTML =
          '<img src="/assets/images/avatar-placeholder.svg" class="avatar-arena" width="32" height="32" alt="" style="flex-shrink:0;" />' +
          '<div class="bubble">' +
            '<div class="meta">' + ui.escapeHtml(msg.username || 'Player') + ' · ' + timeOf(msg.createdAt || msg.created_at) + '</div>' +
            '<div class="text">' + ui.escapeHtml(msg.message) + '</div>' +
          '</div>';
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function renderHistory(messages) {
        messagesEl.innerHTML = '';
        if (!messages || !messages.length) {
          messagesEl.innerHTML = '<p class="text-secondary-arena text-sm text-center py-4 mb-0">No messages yet — say hello!</p>';
          return;
        }
        messages.forEach(function (m) {
          appendMessage({ username: m.sender_username, message: m.message, createdAt: m.created_at }, false);
        });
      }

      async function loadHistory() {
        try {
          var data = await api.get('/chat/' + CHANNEL + '/messages?limit=50');
          renderHistory(data.data.messages || []);
        } catch (err) {
          messagesEl.innerHTML = '<p class="text-danger text-sm text-center py-4 mb-0">' + ui.escapeHtml(err.message || 'Could not load messages') + '</p>';
        }
      }

      function connect() {
        if (typeof io === 'undefined') { setStatus(false, 'Live chat unavailable'); return; }
        socket = io({ auth: { token: api.getAccessToken() } });

        socket.on('connect', function () {
          setStatus(true, 'Live');
          socket.emit('chat:join', { channel: CHANNEL }, function (res) {
            if (res && res.success && res.history && res.history.length) renderHistory(res.history);
          });
        });
        socket.on('connect_error', function () { setStatus(false, 'Reconnecting…'); });
        socket.on('disconnect', function () { setStatus(false, 'Disconnected'); });

        socket.on('chat:message', function (msg) {
          var placeholder = messagesEl.querySelector('p.text-secondary-arena');
          if (placeholder) messagesEl.innerHTML = '';
          appendMessage({ username: msg.senderUsername, message: msg.message, createdAt: msg.createdAt }, msg.senderUuid === myUuid);
        });
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) return;
        if (socket && socket.connected) {
          socket.emit('chat:message', { channel: CHANNEL, message: text }, function (res) {
            if (!res || !res.success) ui.showToast((res && res.message) || 'Could not send message', 'error');
          });
          input.value = '';
        } else {
          ui.showToast('Not connected — please wait', 'warning');
        }
      });

      document.addEventListener('arena:includes-loaded', async function () {
        if (!auth.requireAuth()) return;
        document.querySelectorAll('[data-nav]').forEach(function (link) {
          if (link.dataset.nav === 'chat') link.classList.add('active');
        });
        try {
          var user = auth.getUser() || await auth.fetchCurrentUser();
          if (user) myUuid = user.uuid || user.id;
        } catch (err) { /* non-fatal */ }
        await loadHistory();
        connect();
      });
    })();
  </script>

</body>
</html>
