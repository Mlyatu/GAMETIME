<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />

  <style>
    .chat-container { height: calc(100vh - 180px); min-height: 400px; display: flex; flex-direction: column; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; }
    .chat-message { margin-bottom: 12px; max-width: 80%; }
    .chat-message.own { margin-left: auto; text-align: right; }
    .chat-bubble { display: inline-block; padding: 10px 14px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.06); word-break: break-word; }
    .chat-message.own .chat-bubble { background: rgba(var(--color-primary-rgb),0.2); color: #fff; }
    .chat-meta { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
    .chat-input { padding: 16px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 10px; }
    .chat-typing { font-size: 12px; color: var(--text-secondary); min-height: 18px; padding: 0 16px; }
    .connection-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .connection-dot.online { background: var(--color-success); }
    .connection-dot.offline { background: var(--color-danger); }
  </style>
</head>
<body>

  <div class="d-flex">
    <div data-include="/components/sidebar.html"></div>

    <div class="flex-grow-1" style="min-width:0;">
      <div data-include="/components/topbar.html"></div>

      <main class="container-arena py-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
          <div>
            <h1 class="mb-1">Chat</h1>
            <p class="text-secondary-arena mb-0" id="connectionStatus"><span class="connection-dot offline" id="connectionDot"></span><span id="connectionText">Connecting...</span></p>
          </div>
          <div class="d-flex align-items-center gap-2">
            <label class="text-sm text-muted mb-0">Channel:</label>
            <select id="channelSelect" class="form-control-arena" style="min-width:200px;">
              <option value="global">Global Lobby</option>
            </select>
          </div>
        </div>

        <div class="glass-card chat-container">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-typing" id="typingIndicator"></div>
          <form class="chat-input" id="chatForm">
            <input type="text" id="messageInput" class="form-control-arena flex-grow-1" placeholder="Type a message..." autocomplete="off" maxlength="2000" />
            <button type="submit" class="btn-arena btn-arena--primary" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    (function () {
      const messagesEl = document.getElementById('chatMessages');
      const connectionDot = document.getElementById('connectionDot');
      const connectionText = document.getElementById('connectionText');
      const channelSelect = document.getElementById('channelSelect');
      const typingIndicator = document.getElementById('typingIndicator');

      let socket = null;
      let currentChannel = 'global';
      let typingTimeout = null;
      let currentUserUuid = null;

      function setConnected(connected) {
        connectionDot.className = `connection-dot ${connected ? 'online' : 'offline'}`;
        connectionText.textContent = connected ? 'Connected' : 'Disconnected — messages may be delayed';
      }

      function normalizeMessage(m) {
        return {
          id: m.id,
          message: m.message,
          createdAt: m.created_at || m.createdAt,
          senderUuid: m.sender_uuid || m.senderUuid,
          senderUsername: m.sender_username || m.senderUsername,
        };
      }

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function appendMessage(m, prepend = false) {
        const msg = normalizeMessage(m);
        const isOwn = msg.senderUuid === currentUserUuid;
        const div = document.createElement('div');
        div.className = `chat-message ${isOwn ? 'own' : ''}`;
        div.innerHTML = `
          <div class="chat-bubble">${ui.escapeHtml(msg.message)}</div>
          <div class="chat-meta">${ui.escapeHtml(msg.senderUsername)} &middot; ${new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
        `;
        if (prepend) {
          messagesEl.insertBefore(div, messagesEl.firstChild);
        } else {
          messagesEl.appendChild(div);
          scrollToBottom();
        }
      }

      function renderHistory(messages) {
        messagesEl.innerHTML = '';
        if (!messages || messages.length === 0) {
          messagesEl.innerHTML = '<div class="text-center text-muted text-sm mt-5">No messages yet. Say hello!</div>';
          return;
        }
        messages.forEach((m) => appendMessage(m, true));
        scrollToBottom();
      }

      async function loadHistory(channel) {
        try {
          const data = await api.get(`/chat/${encodeURIComponent(channel)}/messages?limit=50`);
          renderHistory(data.data.messages || []);
        } catch (err) {
          messagesEl.innerHTML = `<div class="text-center text-danger text-sm mt-5">${ui.escapeHtml(err.message || 'Failed to load chat history')}</div>`;
        }
      }

      function connect() {
        const token = api.getAccessToken();
        if (!token) return;

        try {
          const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
          currentUserUuid = payload.sub;
        } catch {
          currentUserUuid = null;
        }

        socket = io('http://localhost:5000', {
          auth: { token },
          transports: ['websocket'],
          reconnection: true,
        });

        socket.on('connect', () => {
          setConnected(true);
          joinChannel(currentChannel);
        });

        socket.on('disconnect', () => setConnected(false));
        socket.on('connect_error', () => setConnected(false));

        socket.on('chat:message', (msg) => {
          appendMessage(msg);
        });

        socket.on('chat:typing', ({ username, isTyping }) => {
          if (!isTyping) {
            typingIndicator.textContent = '';
            return;
          }
          typingIndicator.textContent = `${ui.escapeHtml(username)} is typing...`;
          clearTimeout(typingTimeout);
          typingTimeout = setTimeout(() => { typingIndicator.textContent = ''; }, 2000);
        });
      }

      function joinChannel(channel) {
        if (!socket || !socket.connected) return;
        socket.emit('chat:join', { channel }, (res) => {
          if (res && !res.success) {
            ui.showToast(res.message || 'Could not join channel', 'error');
          }
        });
      }

      async function populateTournaments() {
        try {
          const data = await api.get('/tournament?limit=100');
          const tournaments = data.data.tournaments || [];
          tournaments.forEach((t) => {
            const opt = document.createElement('option');
            opt.value = t.uuid;
            opt.textContent = `Tournament: ${t.name}`;
            channelSelect.appendChild(opt);
          });
        } catch {
          // keep global only
        }
      }

      function sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        if (!socket || !socket.connected) {
          ui.showToast('Not connected to chat server', 'error');
          return;
        }

        socket.emit('chat:message', { channel: currentChannel, message: text }, (res) => {
          if (res && !res.success) {
            ui.showToast(res.message || 'Failed to send message', 'error');
          }
        });
        input.value = '';
      }

      function onTyping() {
        if (!socket || !socket.connected) return;
        socket.emit('chat:typing', { channel: currentChannel, isTyping: true });
      }

      document.addEventListener('arena:includes-loaded', () => {
        if (window.auth) { auth.requireAuth(); auth.updateAuthUI(); }
        document.querySelectorAll('[data-nav]').forEach((link) => {
          if (link.dataset.nav === 'chat') link.classList.add('active');
        });

        populateTournaments();
        loadHistory(currentChannel);
        connect();

        document.getElementById('chatForm').addEventListener('submit', sendMessage);
        document.getElementById('messageInput').addEventListener('input', onTyping);

        channelSelect.addEventListener('change', () => {
          currentChannel = channelSelect.value;
          messagesEl.innerHTML = '';
          loadHistory(currentChannel);
          if (socket && socket.connected) {
            socket.emit('chat:leave', { channel: currentChannel });
            joinChannel(currentChannel);
          }
        });
      });
    })();
  </script>
</body>
</html>
