<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />
</head>
<body>

  <div class="auth-shell">
    <div id="particles-bg"></div>

    <div class="glass-card auth-card animate-fade-in-up">
      <a href="/index.html" class="auth-brand text-decoration-none">
        <i class="fa-solid fa-bolt glow-text-primary"></i>
        <span style="color:var(--text-primary);">EFootball <span class="glow-text-secondary">Arena</span></span>
      </a>
      <p class="text-center text-secondary-arena mb-4">Welcome back. Log in to continue competing.</p>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label-arena" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control-arena" placeholder="you@email.com" required />
          <div class="form-error-arena d-none" data-error-for="email"></div>
        </div>

        <div class="mb-2 position-relative">
          <label class="form-label-arena" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control-arena" placeholder="Your password" required />
          <button type="button" class="password-toggle-arena" data-toggle-password="password" style="top: 38px; transform:none;" aria-label="Show password">
            <i class="fa-solid fa-eye"></i>
          </button>
          <div class="form-error-arena d-none" data-error-for="password"></div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
          <label class="d-flex align-items-center gap-2 text-sm text-secondary-arena mb-0">
            <input type="checkbox" class="checkbox-arena" id="rememberMe" /> Remember me
          </label>
          <a href="/pages/forgot-password.html" class="text-sm">Forgot password?</a>
        </div>

        <div class="d-none" id="formError" style="background:rgba(var(--color-danger-rgb),.12); border:1px solid rgba(var(--color-danger-rgb),.3); border-radius:var(--radius-sm); padding:12px 16px; color:var(--color-danger); font-size:var(--text-sm); margin-bottom:16px;"></div>

        <button type="submit" class="btn-arena btn-arena--primary w-100" id="loginSubmitBtn">
          <span id="loginBtnText">Log In</span>
          <span class="spinner-arena d-none" id="loginBtnSpinner"></span>
        </button>
      </form>

      <div class="auth-divider">OR</div>

      <p class="text-center text-sm mb-0">
        Don't have an account? <a href="/pages/register.html">Create one free</a>
      </p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
  <script src="/assets/js/particles-config.js"></script>
  <script src="/assets/js/form-utils.js"></script>
  <script>
    // TODO (Step 13): wire this to POST /api/auth/login and store the
    // returned accessToken/refreshToken (localStorage if "remember me"
    // is checked, sessionStorage otherwise), then redirect to
    // /pages/dashboard.html.
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      clearFormErrors(this);

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let hasError = false;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showFieldError('email', 'Enter a valid email address'); hasError = true; }
      if (!password) { showFieldError('password', 'Password is required'); hasError = true; }
      if (hasError) return;

      const btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;
      document.getElementById('loginBtnText').classList.add('d-none');
      document.getElementById('loginBtnSpinner').classList.remove('d-none');

      setTimeout(() => {
        btn.disabled = false;
        document.getElementById('loginBtnText').classList.remove('d-none');
        document.getElementById('loginBtnSpinner').classList.add('d-none');
        const err = document.getElementById('formError');
        err.textContent = 'Form validated successfully — API wiring lands in Step 13.';
        err.style.color = 'var(--color-warning)';
        err.style.background = 'rgba(var(--color-warning-rgb),.12)';
        err.classList.remove('d-none');
      }, 600);
    });
  </script>
</body>
</html>
