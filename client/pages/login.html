<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — EFootball Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />
  <style>
    .login-page .auth-shell {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    .login-page #particles-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .login-page .auth-card {
      width: min(100%, 440px);
      padding: clamp(24px, 5vw, 40px);
    }

    .login-notice {
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: var(--text-sm);
      margin-bottom: 16px;
    }

    .login-notice--warning {
      color: #f3d58c;
      background: rgba(var(--color-warning-rgb), 0.08);
      border-color: rgba(var(--color-warning-rgb), 0.2);
    }

    .login-notice--error {
      color: #f2b5c0;
      background: rgba(var(--color-danger-rgb), 0.08);
      border-color: rgba(var(--color-danger-rgb), 0.2);
    }
  </style>
</head>
<body class="login-page">

  <div class="auth-shell">
    <div id="particles-bg"></div>

    <div class="glass-card auth-card animate-fade-in-up">
      <a href="/index.html" class="auth-brand text-decoration-none">
        <i class="fa-solid fa-bolt glow-text-primary"></i>
        <span style="color:var(--text-primary);">EFootball <span class="glow-text-secondary">Arena</span></span>
      </a>
      <p class="text-center text-secondary-arena mb-4">Welcome back. Log in to continue competing.</p>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label-arena" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control-arena" placeholder="you@email.com" required />
          <div class="form-error-arena d-none" data-error-for="email"></div>
        </div>

        <div class="mb-2 position-relative">
          <label class="form-label-arena" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control-arena" placeholder="Your password" required />
          <button type="button" class="password-toggle-arena" data-toggle-trigger="password" style="top: 38px; transform:none;" aria-label="Show password">
            <i class="fa-solid fa-eye"></i>
          </button>
          <div class="form-error-arena d-none" data-error-for="password"></div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
          <label class="d-flex align-items-center gap-2 text-sm text-secondary-arena mb-0">
            <input type="checkbox" class="checkbox-arena" id="rememberMe" /> Remember me
          </label>
          <a href="/pages/forgot-password.html" class="text-sm">Forgot password?</a>
        </div>

        <div class="login-notice login-notice--error d-none" id="formError" role="status" aria-live="polite"></div>
        <button type="button" class="btn-arena btn-arena--secondary btn-arena--sm w-100 mb-3 d-none" id="resendVerificationBtn">
          <span>Resend verification email</span>
          <span class="spinner-arena d-none"></span>
        </button>

        <button type="submit" class="btn-arena btn-arena--primary w-100" id="loginSubmitBtn">
          <span id="loginBtnText">Log In</span>
          <span class="spinner-arena d-none" id="loginBtnSpinner"></span>
        </button>
      </form>

      <a href="/api/auth/google" class="btn-arena btn-arena--secondary w-100 mt-3">
        <i class="fa-brands fa-google"></i> Continue with Google
      </a>

      <div class="auth-divider">OR</div>

      <p class="text-center text-sm mb-0">
        Don't have an account? <a href="/pages/register.html">Create one free</a>
      </p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
  <script src="/assets/js/particles-config.js"></script>
  <script src="/assets/js/form-utils.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const oauthStatus = new URLSearchParams(window.location.search).get('oauth');
      const formError = document.getElementById('formError');
      if (oauthStatus === 'not-configured') {
        formError.classList.replace('login-notice--error', 'login-notice--warning');
        formError.textContent = 'Google sign-in is not set up yet. You can still log in with your email and password.';
        formError.classList.remove('d-none');
      } else if (oauthStatus === 'failed') {
        formError.textContent = 'Google sign-in could not be completed. Please try again.';
        formError.classList.remove('d-none');
      }
      if (window.auth && auth.handleGoogleCallback) {
        try {
          if (await auth.handleGoogleCallback()) return;
        } catch {
          formError.textContent = 'Google sign-in could not be completed. Please try again.';
          formError.classList.remove('d-none');
        }
      }
      if (window.auth && auth.redirectIfAuthenticated) auth.redirectIfAuthenticated();
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      clearFormErrors(this);

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let hasError = false;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showFieldError('email', 'Enter a valid email address'); hasError = true; }
      if (!password) { showFieldError('password', 'Password is required'); hasError = true; }
      if (hasError) return;

      const btn = document.getElementById('loginSubmitBtn');
      const formError = document.getElementById('formError');
      const resendBtn = document.getElementById('resendVerificationBtn');
      formError.classList.add('d-none');
      resendBtn.classList.add('d-none');
      ui.setButtonLoading(btn, true);

      try {
        await auth.login(email, password, document.getElementById('rememberMe').checked);
        const next = new URLSearchParams(window.location.search).get('next') || '/pages/dashboard.html';
        window.location.href = next;
      } catch (err) {
        if (err.code === 'EMAIL_NOT_VERIFIED') {
          formError.textContent = err.message;
          formError.classList.remove('d-none');
          resendBtn.classList.remove('d-none');
        } else {
          resendBtn.classList.add('d-none');
          ui.handleApiFormError(err, this);
        }
      } finally {
        ui.setButtonLoading(btn, false);
      }
    });

    document.getElementById('resendVerificationBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const button = document.getElementById('resendVerificationBtn');
      const formError = document.getElementById('formError');
      ui.setButtonLoading(button, true, 'Sending...');
      try {
        const result = await api.post('/auth/resend-verification', { email });
        formError.textContent = result.message;
        formError.classList.remove('d-none');
        formError.classList.replace('login-notice--error', 'login-notice--warning');
      } catch (err) {
        formError.textContent = err.message || 'The verification email could not be sent. Please try again later.';
        formError.classList.remove('d-none');
        formError.classList.replace('login-notice--warning', 'login-notice--error');
      } finally {
        ui.setButtonLoading(button, false);
      }
    });
  </script>
</body>
</html>
