<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EFootball Arena - Compete. Win. Repeat.</title>
  <meta name="description" content="The competitive home for eFootball tournaments — fair fixtures, verified results, real prizes." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/glass.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />
  <link rel="stylesheet" href="/assets/css/marketing.css" />
</head>
<body>

  <div data-include="/components/public-navbar.html"></div>

  <!-- HERO -->
  <section class="hero-arena">
    <div id="particles-bg"></div>
    <div class="football-orbit" aria-hidden="true">
      <span class="football-ball">&#9917;</span>
    </div>
    <div class="container-arena hero-content text-center">
      <div class="animate-fade-in-up">
        <span class="hero-eyebrow"><i class="fa-solid fa-circle animate-live-ping" style="font-size:6px;"></i> eFootball tournaments</span>
      </div>
      <h1 class="mt-4 animate-fade-in-up animate-stagger" style="--delay:1; font-size: clamp(2.5rem, 6vw, 4.5rem);">
        Compete. <span class="glow-text-primary">Win.</span> <span class="glow-text-secondary">Repeat.</span>
      </h1>
      <p class="text-secondary-arena mx-auto animate-fade-in-up animate-stagger" style="--delay:2; max-width: 560px; font-size: var(--text-lg);">
        Join tournaments with scheduled fixtures, screenshot-verified results, and standings reviewed by admins.
      </p>
      <div class="d-flex gap-3 justify-content-center flex-wrap mt-4 animate-fade-in-up animate-stagger" style="--delay:3;">
        <a href="/pages/register.html" class="btn-arena btn-arena--primary"><i class="fa-solid fa-bolt"></i> Get Started Free</a>
        <a href="/pages/tournaments.html" class="btn-arena btn-arena--secondary"><i class="fa-solid fa-trophy"></i> Browse Tournaments</a>
      </div>

    </div>
  </section>

  <!-- FEATURED TOURNAMENTS -->
  <section class="container-arena py-5">
    <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-2">
      <div>
        <h2 class="mb-1">Featured Tournaments</h2>
        <p class="text-secondary-arena mb-0">Open competitions accepting players.</p>
      </div>
      <a href="/pages/tournaments.html" class="btn-arena btn-arena--secondary btn-arena--sm">View All <i class="fa-solid fa-arrow-right"></i></a>
    </div>
    <div class="row g-4" id="featuredTournaments">
      <div class="col-12 text-secondary-arena" id="featuredTournamentMessage">Loading tournaments...</div>
    </div>
  </section>

  <div data-include="/components/footer.html"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/particles-config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('featuredTournaments');
      const message = document.getElementById('featuredTournamentMessage');
      try {
        const response = await api.get('/tournament?status=registration_open&limit=3');
        const tournaments = response.data.tournaments || [];
        if (!tournaments.length) {
          message.textContent = 'No tournaments are open for registration right now.';
          return;
        }
        message.remove();
        grid.innerHTML = tournaments.map((tournament) => `
          <div class="col-md-4">
            <article class="glass-card p-4 h-100">
              <span class="badge-arena badge-arena--primary mb-2">Registration Open</span>
              <h5>${ui.escapeHtml(tournament.name)}</h5>
              <p class="text-sm text-secondary-arena">${ui.escapeHtml(String(tournament.format || '').replace(/_/g, ' '))} · ${Number(tournament.approved_count || 0)} / ${ui.escapeHtml(tournament.max_participants || 'Open')} players</p>
              <a href="/pages/tournament-detail.html?id=${encodeURIComponent(tournament.uuid)}" class="btn-arena btn-arena--secondary btn-arena--sm">View details</a>
            </article>
          </div>`).join('');
      } catch {
        message.textContent = 'Tournaments are temporarily unavailable.';
      }
    });
  </script>
</body>
</html>
